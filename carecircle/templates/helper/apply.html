{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h3 class="text-primary mb-3">Helper Profile</h3>
        <form method="POST">
          <div class="mb-3"><label class="form-label">Skills</label><input class="form-control" name="skills" value="Grocery, Companion Support"></div>
          <div class="mb-3"><label class="form-label">Experience</label><input class="form-control" name="experience" value="3 years"></div>
          <div class="mb-3"><label class="form-label">Service Area</label><input class="form-control" name="service_area" value="Hyderabad"></div>
          <div class="mb-3"><label class="form-label">Availability</label><input class="form-control" name="availability" value="9:00 AM - 6:00 PM"></div>
          <button class="btn btn-primary w-100">Submit for Verification</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
