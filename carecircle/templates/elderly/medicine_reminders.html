{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h3 class="text-primary mb-3">Medicine Reminders</h3>
        <form method="POST">
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Medicine name</label><input class="form-control" name="medicine_name" required></div>
            <div class="col-md-6"><label class="form-label">Reminder time</label><input class="form-control" type="time" name="reminder_time" required></div>
            <div class="col-md-6"><label class="form-label">Frequency</label><input class="form-control" name="frequency" value="Daily"></div>
            <div class="col-md-6"><label class="form-label">Notes</label><input class="form-control" name="notes"></div>
          </div>
          <button class="btn btn-primary mt-3 w-100">Save Reminder</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
