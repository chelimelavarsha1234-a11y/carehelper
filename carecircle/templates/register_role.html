{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-lg-5">
                <h2 class="text-center text-primary mb-4">Register as {{ role|title }}</h2>
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" name="name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" name="phone">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Location</label>
                            <input type="text" class="form-control" name="location" placeholder="Hyderabad">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" name="confirm_password" required>
                        </div>
                        {% if role == 'elderly' %}
                        <div class="col-md-4">
                            <label class="form-label">Age</label>
                            <input type="number" class="form-control" name="age" min="1">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Preferred Language</label>
                            <input type="text" class="form-control" name="preferred_language" value="English">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Emergency Contact</label>
                            <input type="text" class="form-control" name="emergency_contact">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Address</label>
                            <input type="text" class="form-control" name="address">
                        </div>
                        {% elif role == 'family' %}
                        <div class="col-md-6">
                            <label class="form-label">Relationship</label>
                            <input type="text" class="form-control" name="relationship" placeholder="Daughter">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Linked Elderly User ID (optional)</label>
                            <input type="number" class="form-control" name="elderly_user_id" placeholder="Leave blank for later">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Address</label>
                            <input type="text" class="form-control" name="address">
                        </div>
                        {% elif role == 'helper' %}
                        <div class="col-md-6">
                            <label class="form-label">Address</label>
                            <input type="text" class="form-control" name="address">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Service Area</label>
                            <input type="text" class="form-control" name="service_area" placeholder="Hyderabad">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Skills</label>
                            <input type="text" class="form-control" name="skills" placeholder="Grocery, Companionship">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Experience</label>
                            <input type="text" class="form-control" name="experience" placeholder="3 years">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Availability</label>
                            <input type="text" class="form-control" name="availability" placeholder="9:00 AM - 6:00 PM">
                        </div>
                        {% endif %}
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-4 btn-lg">Create Account</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
